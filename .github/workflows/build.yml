name: Build module APK

# 依据项目规则：编译/打包/构建产物只能通过 GitHub Actions 执行，禁止本地构建。
# 触发方式：手动触发（workflow_dispatch），或向 main 的 PR、以及功能分支推送时自动构建验证。
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "构建类型"
        required: true
        default: "Debug"
        type: choice
        options:
          - Debug
          - Release

  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/**'

  push:
    branches-ignore: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    name: Assemble APK
    # 固定到 ubuntu-24.04：该镜像预装 Android SDK 与 cmdline-tools。
    # 不跟随 ubuntu-latest，因为官方已通告该标签将于 2026-10 迁移到 Ubuntu 26，
    # 届时预装 SDK 路径与 build-tools 版本都可能变化，会直接影响本工作流。
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 镜像已预装 Android SDK 与 cmdline-tools，
      # 这里直接复用，避免 android-actions/setup-android 在较新镜像上
      # 执行已移除的 `sdkmanager tools` 而失败。
      #
      # 注意：API 37 起平台包名带次版本号，实际包为 `platforms;android-37.0`，
      # 不存在 `platforms;android-37`。
      - name: Install required SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -e

          # 若镜像未预装 cmdline-tools，则先下载官方 cmdline-tools 作为兜底。
          if [ ! -d "$ANDROID_HOME/cmdline-tools" ]; then
            echo "cmdline-tools not present, downloading"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            (cd /tmp && rm -rf cmdline-tools && mkdir cmdline-tools \
              && cd cmdline-tools && python3 -c "import zipfile;zipfile.ZipFile('/tmp/cmdline-tools.zip').extractall('.')")
            mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          fi

          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)
          fi
          echo "sdkmanager: $SDKMGR"

          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-37.0" "build-tools;36.0.0"

          echo "--- installed platforms ---"
          ls "$ANDROID_HOME/platforms"
          echo "--- installed build-tools ---"
          ls "$ANDROID_HOME/build-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Resolve requested build type
        id: cfg
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "task=${{ github.event.inputs.build_type }}" >> "$GITHUB_OUTPUT"
          else
            echo "task=Debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify xposed resources are present
        run: |
          set -e
          for f in app/src/main/resources/META-INF/xposed/java_init.list \
                   app/src/main/resources/META-INF/xposed/module.prop \
                   app/src/main/resources/META-INF/xposed/scope.list; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          echo "entry class: $(cat app/src/main/resources/META-INF/xposed/java_init.list)"

      - name: Assemble
        run: gradle --no-daemon assemble${{ steps.cfg.outputs.task }}

      # 阶段 2 起单元测试是必要验证项（模板转义、路径提取、调度去重/过期丢弃/重试）。
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report-${{ github.sha }}
          path: app/build/reports/tests/**
          if-no-files-found: ignore

      - name: Verify APK contents (xposed entry + scope)
        run: |
          set -e
          APK=$(find app/build/outputs/apk -name '*.apk' | head -n 1)
          echo "APK: $APK"
          test -n "$APK" || { echo "no apk produced"; exit 1; }
          echo "--- META-INF/xposed entries ---"
          unzip -l "$APK" | grep -i 'META-INF/xposed' || { echo "xposed metadata missing from APK"; exit 1; }
          echo "--- java_init.list ---"
          unzip -p "$APK" META-INF/xposed/java_init.list
          echo "--- module.prop ---"
          unzip -p "$APK" META-INF/xposed/module.prop

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DiscordAutoTranslate-${{ steps.cfg.outputs.task }}-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
